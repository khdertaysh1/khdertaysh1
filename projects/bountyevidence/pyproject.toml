[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bountyevidence"
version = "0.1.0"
description = "Build consistent, privacy-conscious vulnerability reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Khedr Tayshoori"}]
keywords = ["security", "blue-team", "termux", "offline"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
bountyevidence = "bountyevidence.cli:main"

[tool.setuptools.packages.find]
include = ["bountyevidence*"]
